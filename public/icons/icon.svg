<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner subtle ambient circle -->
  <circle cx="256" cy="256" r="180" fill="#FFFFFF" fill-opacity="0.1" />

  <!-- Interlocking two heart / mood waves -->
  <g transform="translate(0, -10)">
    <!-- Central warm heart -->
    <path d="M256 390 C256 390 136 295 136 195 C136 142 178 100 231 100 C241 100 251 102 256 106 C261 102 271 100 281 100 C334 100 376 142 376 195 C376 295 256 390 256 390 Z" 
          fill="#FFFFFF" />

    <!-- Two smiling eyes inside the heart representing the two partners -->
    <!-- Partner 1 eye -->
    <path d="M210 195 C210 185 220 180 228 185" 
          stroke="#F43F5E" stroke-width="7" stroke-linecap="round" fill="none" />
    
    <!-- Partner 2 eye -->
    <path d="M284 185 C292 180 302 185 302 195" 
          stroke="#F43F5E" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Connected gentle smile between the two -->
    <path d="M236 225 Q256 242 276 225" 
          stroke="#F43F5E" stroke-width="6" stroke-linecap="round" fill="none" />
  </g>
</svg>
